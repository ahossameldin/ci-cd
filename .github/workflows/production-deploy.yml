name: Production Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: self-hosted

    steps:

      # =========================================================
      # 1. Checkout the tagged source
      # =========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # 2. Set execution policy
      # =========================================================

      - name: Set execution policy
        shell: powershell
        run: |
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope LocalMachine -Force
          Write-Host "Execution policy set to RemoteSigned."


      # =========================================================
      # 3. Get version from tag
      # =========================================================

      - name: Set version
        shell: powershell
        env:
          VERSION: ${{ github.ref_name }}
        run: .\scripts\01-set-version.ps1


      # =========================================================
      # 4. Detect live / new ports
      # =========================================================

      - name: Detect ports
        shell: powershell
        run: .\scripts\00-detect-ports.ps1


      # =========================================================
      # 5. Restore
      # =========================================================

      - name: Restore
        shell: powershell
        run: .\scripts\02-restore.ps1


      # =========================================================
      # 6. Build
      # =========================================================

      - name: Build
        shell: powershell
        run: .\scripts\03-build.ps1


      # =========================================================
      # 7. Publish versioned release
      # =========================================================

      - name: Publish Release
        shell: powershell
        run: .\scripts\04-publish.ps1


      # =========================================================
      # 8. Database migration
      # =========================================================

      - name: Database Migration
        shell: powershell
        run: .\scripts\05-database-migration.ps1


      # =========================================================
      # 9. Prepare new port
      # =========================================================

      - name: Prepare New Port
        shell: powershell
        run: .\scripts\06-prepare-green.ps1


      # =========================================================
      # 10. Start NEW RELEASE on new port
      # =========================================================

      - name: Start New Release
        shell: powershell
        run: .\scripts\07-start-green.ps1


      # =========================================================
      # 11. Health check new port
      # =========================================================

      - name: Health Check New Port
        shell: powershell
        run: .\scripts\08-health-check-green.ps1


      # =========================================================
      # 12. Switch Caddy
      # =========================================================

      - name: Switch Caddy
        shell: powershell
        run: .\scripts\09-switch-caddy.ps1


      # =========================================================
      # 13. Verify through Caddy
      # =========================================================

      - name: Verify Production
        shell: powershell
        run: .\scripts\10-verify-production.ps1


      # =========================================================
      # 14. Stop old port
      # =========================================================

      - name: Stop Old Port
        shell: powershell
        run: .\scripts\11-stop-blue.ps1


      # =========================================================
      # 15. Done
      # =========================================================

      - name: Deployment Complete
        shell: powershell
        run: .\scripts\12-deployment-complete.ps1
